name: Auto Assign
on:
  issues:
    types: [labeled]
jobs:
  run:
    runs-on: ubuntu-latest

    permissions:
      issues: write
    
    steps:
      - uses: wow-actions/auto-assign@67fafa03df61d7e5f201734a2fa60d1ab111880d # v3.0.2
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          assignees: ambikakunnath
          includeLabels: regression
      - uses: wow-actions/auto-assign@67fafa03df61d7e5f201734a2fa60d1ab111880d # v3.0.2
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          assignees: ambikakunnath
          includeLabels: bluescreen
